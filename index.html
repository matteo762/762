    <style>
        :root {
            --background: #050505;
            --card: #111111;
            --glow-white: #F4FBFF;
            --accent-cyan: #7DF9FF;
            --text-secondary: #8A8A8A;
            --font-main: 'Sora', sans-serif;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--background);
            color: #ffffff;
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: var(--background);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: calc(var(--safe-top) + 15px) 20px 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .logo {
            font-weight: 800;
            font-size: 26px;
            letter-spacing: -1.5px;
            color: #ffffff;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: calc(var(--safe-bottom) + 80px);
            scrollbar-width: none;
        }
        .main-content::-webkit-scrollbar { display: none; }

        .screen {
            display: none;
            padding: 20px;
            animation: fadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        /* --- 1. HOME FEED --- */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 0px 0px 20px 0px;
            scrollbar-width: none;
        }
        .stories-container::-webkit-scrollbar { display: none; }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: var(--text-secondary);
            min-width: 65px;
        }

        .story-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 10px rgba(125, 249, 255, 0.25);
            margin-bottom: 6px;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            color: #fff;
        }

        .story.me .story-avatar {
            border: 2px dashed var(--text-secondary);
            box-shadow: none;
            color: var(--text-secondary);
        }

        .feed-post {
            background-color: var(--card);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #222;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 13px;
        }

        .user-meta h4 { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; }
        .user-meta p { font-size: 11px; color: var(--text-secondary); }

            width: 100%;
            height: 260px;
            border-radius: 18px;
            background: linear-gradient(180deg, #0a0a0a 0%, #15191e 100%);
